<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clip Poster · Login</title>
<style>body{font:16px/1.6 system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 16px;color:#222;background:#fff}</style>
</head><body>
<h1>TikTok login</h1>
<p id="msg">Finishing login…</p>
<script>
  // Hands the TikTok login result back to Clip Poster running on this computer.
  const p = new URLSearchParams(location.search);
  const msg = document.getElementById("msg");
  if (p.get("code")) {
    location.replace("http://localhost:8765/callback" + location.search);
  } else {
    msg.textContent = "Login failed: " + (p.get("error_description") || p.get("error") || "no code returned");
  }
</script>
</body></html>
